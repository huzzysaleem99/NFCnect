<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NFCnect Digital Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #0d0d0d;
            border: 1px solid #c9a227;
            border-radius: 24px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 0 30px rgba(201,162,39,0.15);
        }

        .logo {
            color: #c9a227;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        .job {
            color: #c9a227;
            font-size: 17px;
            margin-top: 10px;
        }

        .company {
            color: #cccccc;
            margin-bottom: 30px;
        }

        .button {
            display: block;
            text-decoration: none;
            color: #050505;
            background: #c9a227;
            padding: 14px;
            border-radius: 10px;
            margin: 12px 0;
            font-weight: bold;
        }

        .footer {
            margin-top: 30px;
            color: #777777;
            font-size: 12px;
        }

        #error {
            color: #c9a227;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">NFCnect</div>

    <div id="loading">
        Loading profile...
    </div>

    <div id="profile" style="display:none;">

        <h1 id="full_name"></h1>

        <div class="job" id="job_title"></div>

        <div class="company" id="company"></div>

        <a class="button" id="phone">
            📞 Call
        </a>

        <a class="button" id="email">
            ✉️ Email
        </a>

        <a class="button" id="website" target="_blank">
            🌐 Website
        </a>

        <a class="button" id="linkedin" target="_blank">
            LinkedIn
        </a>

    </div>

    <div id="error"></div>

    <div class="footer">
        Powered by NFCnect
    </div>

</div>

<script>

const SUPABASE_URL =
"https://qldzzuqdzoarboonnizn.supabase.co/rest/v1";

const SUPABASE_KEY =
"sb_publishable_MOUxn_K0T9DpYe0ZZyk-TA_cMjATkVd";

const pathParts = window.location.pathname.split("/").filter(Boolean);

let CARD_ID = null;

if (pathParts[0] === "c" && pathParts[1]) {
    CARD_ID = pathParts[1];
}

async function loadProfile() {
    if (!CARD_ID) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("error").innerText =
        "No NFCnect card selected.";
    return;
}

    try {

        const response = await fetch(
            `${SUPABASE_URL}/Profiles?card_id=eq.${CARD_ID}&status=eq.active&select=*`,
            {
                headers: {
                    "apikey": SUPABASE_KEY
                }
            }
        );

        if (!response.ok) {
            throw new Error("Database request failed");
        }

        const profiles = await response.json();

        document.getElementById("loading").style.display = "none";

        if (profiles.length === 0) {
            document.getElementById("error").innerText =
                "Profile not found.";
            return;
        }

        const person = profiles[0];

        document.getElementById("full_name").innerText =
            person.full_name || "";

        document.getElementById("job_title").innerText =
            person.job_title || "";

        document.getElementById("company").innerText =
            person.company || "";

        document.getElementById("phone").href =
            `tel:${person.phone}`;

        document.getElementById("email").href =
            `mailto:${person.email}`;

        document.getElementById("website").href =
            person.website;

        document.getElementById("linkedin").href =
            person.linkedin;

        document.getElementById("profile").style.display =
            "block";

    } catch (error) {

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("error").innerText =
            "Unable to load profile.";

        console.error(error);
    }
}

loadProfile();

</script>

</body>
</html>
