<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VEUQO Digital Card</title>

    <style>

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
    background: #050505;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.card {
    width: 100%;
    max-width: 420px;
    background: #0d0d0d;
    border: 1px solid #c9a227;
    border-radius: 24px;
    padding: 40px 25px;
    text-align: center;
    box-shadow: 0 0 30px rgba(201,162,39,0.15);
}

.logo {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    letter-spacing: 6px;
    color: #c9a227;
    font-size: 32px;
    margin-bottom: 40px;
}

h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.5px;
}

.job {
    color: #c9a227;
    font-size: 17px;
    margin-top: 10px;
}

.company {
    color: #cccccc;
    margin-top: 5px;
    margin-bottom: 30px;
}

.button {
    display: block;
    text-decoration: none;
    color: #f5f5f5;
    background: #141414;
    padding: 16px 18px;
    border: 1px solid rgba(201, 162, 39, 0.45);
    border-radius: 12px;
    margin: 12px 0;
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.3px;
    transition: all 0.2s ease;
}

.button:hover {
    background: #1a1a1a;
    border-color: #c9a227;
    transform: translateY(-1px);
}

.save-contact {
    margin-top: 35px;
    background: #c9a227;
    color: #050505;
    border: 1px solid #c9a227;
    font-weight: 600;
}

.save-contact:hover {
    background: #d6b43a;
}

.footer {
    margin-top: 30px;
    color: #777777;
    font-size: 12px;
}

#error {
    color: #c9a227;
}

</style>
</head>

<body>

<div class="card">

    <div class="logo">VEUQO</div>

    <div id="loading">
        Loading profile...
    </div>

    <div id="profile" style="display:none;">

        <h1 id="full_name"></h1>

        <div class="job" id="job_title"></div>

        <div class="company" id="company"></div>
        

        <a class="button" id="phone">
            📞 Call
        </a>

        <a class="button" id="email">
            ✉️ Email
        </a>

        <a class="button" id="website" target="_blank">
            🌐 Website
        </a>

        <a class="button" id="linkedin" target="_blank">
            LinkedIn
        </a>
        
        <a class="button" id="saveContact" href="#">
    👤 Save Contact
</a>

    </div>

    <div id="error"></div>

    <div class="footer">
        Powered by VEUQO
    </div>

</div>

<script>

const SUPABASE_URL =
"https://qldzzuqdzoarboonnizn.supabase.co/rest/v1";

const SUPABASE_KEY =
"sb_publishable_MOUxn_K0T9DpYe0ZZyk-TA_cMjATkVd";

const pathParts = window.location.pathname.split("/").filter(Boolean);

let CARD_ID = null;
let currentPerson = null;

if (pathParts[0] === "c" && pathParts[1]) {
    CARD_ID = pathParts[1];
}

async function loadProfile() {

    if (!CARD_ID) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").innerText =
            "No VEUQO card selected.";
        return;
    }

    try {

        const response = await fetch(
            `${SUPABASE_URL}/Profiles?card_id=eq.${encodeURIComponent(CARD_ID)}&status=eq.active&select=*`,
            {
                headers: {
                    "apikey": SUPABASE_KEY
                }
            }
        );

        if (!response.ok) {
            throw new Error("Database request failed");
        }

        const profiles = await response.json();

        document.getElementById("loading").style.display = "none";

        if (profiles.length === 0) {
            document.getElementById("error").innerText =
                "Profile not found.";
            return;
        }

        const person = profiles[0];
        currentPerson = person;

        document.getElementById("full_name").innerText =
            person.full_name || "";

        document.getElementById("job_title").innerText =
            person.job_title || "";

        document.getElementById("company").innerText =
            person.company || "";

        document.getElementById("phone").href =
            `tel:${person.phone || ""}`;

        document.getElementById("email").href =
            `mailto:${person.email || ""}`;

        document.getElementById("website").href =
            person.website || "#";

        document.getElementById("linkedin").href =
            person.linkedin || "#";

        document.getElementById("profile").style.display =
            "block";

    } catch (error) {

        document.getElementById("loading").style.display = "none";

        document.getElementById("error").innerText =
            "Unable to load profile.";

        console.error(error);
    }
}


/* SAVE CONTACT */

function escapeVCard(value) {
    return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/\n/g, "\\n")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,");
}

function saveContact(event) {

    event.preventDefault();

    if (!currentPerson) {
        return;
    }

    const person = currentPerson;

    const vCard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `FN:${escapeVCard(person.full_name)}`,
        `ORG:${escapeVCard(person.company)}`,
        `TITLE:${escapeVCard(person.job_title)}`,
        `TEL;TYPE=CELL:${escapeVCard(person.phone)}`,
        `EMAIL;TYPE=INTERNET:${escapeVCard(person.email)}`,
        `URL:${escapeVCard(person.website)}`,
        `NOTE:${escapeVCard(person.linkedin)}`,
        "END:VCARD"
    ].join("\r\n");

    const blob = new Blob(
        [vCard],
        { type: "text/vcard;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);

    const downloadLink = document.createElement("a");

    downloadLink.href = url;
    downloadLink.download =
        `${person.full_name || "contact"}.vcf`;

    document.body.appendChild(downloadLink);

    downloadLink.click();

    document.body.removeChild(downloadLink);

    setTimeout(() => URL.revokeObjectURL(url), 1000);
}


document.getElementById("saveContact")
    .addEventListener("click", saveContact);

loadProfile();

</script>

</body>
</html>
