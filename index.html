<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>George H | NFCnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #000000;
            color: #cfb53b;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #0d0d0d;
            border: 1px solid #c9a227;
            border-radius: 24px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 0 30px rgba(201, 162, 39, 0.15);
        }

        .logo {
            color: #c9a227;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        .job {
            color: #c9a227;
            font-size: 17px;
            margin-top: 10px;
        }

        .company {
            color: #cccccc;
            margin-bottom: 30px;
        }

        .button {
            display: block;
            text-decoration: none;
            color: #050505;
            background: #c9a227;
            padding: 14px;
            border-radius: 10px;
            margin: 12px 0;
            font-weight: bold;
        }

        .button:hover {
            opacity: 0.85;
        }

        .footer {
            margin-top: 30px;
            color: #777777;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">NFCnect</div>

        <h1>TEST</h1>

        <div class="job">
            Technical Sales Manager
        </div>

        <div class="company">
            TEST LTD
        </div>

        <a class="button" href="tel:07562628562">
            📞 Call
        </a>

        <a class="button" href="mailto:hkah@test.co.uk">
            ✉️ Email
        </a>

        <a class="button" href="https://www.google.co.uk" target="_blank">
            🌐 Website
        </a>

        <a class="button" href="https://www.linkedin.com/in/huzaifah-saleem-465555/" target="_blank">
               LinkedIn
        </a>

        <div class="footer">
            Powered by NFCnect.
        </div>

    </div>

</body>
</html>
