<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VEUQO Digital Card</title>

 <style>

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
    background: #050505;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.card {
    width: 100%;
    max-width: 420px;
    background: #0d0d0d;
    border: 1px solid #c9a227;
    border-radius: 24px;
    padding: 42px 25px;
    text-align: center;
    box-shadow: 0 0 35px rgba(201, 162, 39, 0.12);
}

.logo {
    color: #c9a227;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 8px;
    margin-bottom: 48px;
}

h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.3px;
}

.job {
    color: #c9a227;
    font-size: 17px;
    font-weight: 500;
    margin-top: 12px;
}

.company {
    color: #cccccc;
    font-size: 15px;
    margin-top: 6px;
    margin-bottom: 36px;
}


/* MAIN CONTACT BUTTONS */

.button {
    position: relative;
    display: flex;
    align-items: center;

    width: 100%;
    min-height: 64px;

    margin: 12px 0;
    padding: 0 48px 0 20px;

    background: #111111;
    border: 1px solid rgba(201, 162, 39, 0.55);
    border-radius: 14px;

    color: #ffffff;
    text-decoration: none;

    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    font-weight: 500;

    transition: 0.2s ease;
}

.button:hover {
    background: #171717;
    border-color: #c9a227;
}


/* GOLD ICON */

.icon {
    width: 30px;
    margin-right: 16px;

    color: #c9a227;

    font-size: 21px;
    font-weight: 600;

    display: inline-flex;
    justify-content: center;
    align-items: center;
}


/* ARROW */

.button:not(.save-contact)::after {
    content: "›";

    position: absolute;
    right: 20px;

    color: #c9a227;
    font-size: 30px;
    font-weight: 300;

    line-height: 1;
}


/* SAVE CONTACT */

.button.save-contact {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    min-height: 64px;

    margin-top: 34px;
    padding: 0 28px;

    background: #f4f4f4;
    color: #090909;

    border: none;
    border-radius: 999px;

    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2.4px;
    text-transform: uppercase;

    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
}

.button.save-contact:hover {
    background: #ffffff;
    border: none;
}

.save-icon {
    font-size: 22px;
    margin-right: 12px;
    line-height: 1;
    letter-spacing: 0;
}

/* FOOTER */

.footer {
    margin-top: 38px;
    color: #777777;
    font-size: 12px;
}

#error {
    color: #c9a227;
}

</style>
</head>

<body>

<div class="card">

    <div class="logo">VEUQO</div>

    <div id="loading">
        Loading profile...
    </div>

    <div id="profile" style="display:none;">

        <h1 id="full_name"></h1>

        <div class="job" id="job_title"></div>

        <div class="company" id="company"></div>
        

        <a class="button" id="phone">
            📞 Call
        </a>

        <a class="button" id="email">
            ✉️ Email
        </a>

        <a class="button" id="website" target="_blank">
            🌐 Website
        </a>

        <a class="button" id="linkedin" target="_blank">
            LinkedIn
        </a>
        
        <a class="button save-contact" id="saveContact" href="#">
    <span class="save-icon">♙+</span>
    <span>SAVE CONTACT</span>
</a>

    </div>

    <div id="error"></div>

    <div class="footer">
        Powered by VEUQO
    </div>

</div>

<script>

const SUPABASE_URL =
"https://qldzzuqdzoarboonnizn.supabase.co/rest/v1";

const SUPABASE_KEY =
"sb_publishable_MOUxn_K0T9DpYe0ZZyk-TA_cMjATkVd";

const pathParts = window.location.pathname.split("/").filter(Boolean);

let CARD_ID = null;
let currentPerson = null;

if (pathParts[0] === "c" && pathParts[1]) {
    CARD_ID = pathParts[1];
}

async function loadProfile() {

    if (!CARD_ID) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").innerText =
            "No VEUQO card selected.";
        return;
    }

    try {

        const response = await fetch(
            `${SUPABASE_URL}/Profiles?card_id=eq.${encodeURIComponent(CARD_ID)}&status=eq.active&select=*`,
            {
                headers: {
                    "apikey": SUPABASE_KEY
                }
            }
        );

        if (!response.ok) {
            throw new Error("Database request failed");
        }

        const profiles = await response.json();

        document.getElementById("loading").style.display = "none";

        if (profiles.length === 0) {
            document.getElementById("error").innerText =
                "Profile not found.";
            return;
        }

        const person = profiles[0];
        currentPerson = person;

        document.getElementById("full_name").innerText =
            person.full_name || "";

        document.getElementById("job_title").innerText =
            person.job_title || "";

        document.getElementById("company").innerText =
            person.company || "";

        document.getElementById("phone").href =
            `tel:${person.phone || ""}`;

        document.getElementById("email").href =
            `mailto:${person.email || ""}`;

        document.getElementById("website").href =
            person.website || "#";

        document.getElementById("linkedin").href =
            person.linkedin || "#";

        document.getElementById("profile").style.display =
            "block";

    } catch (error) {

        document.getElementById("loading").style.display = "none";

        document.getElementById("error").innerText =
            "Unable to load profile.";

        console.error(error);
    }
}


/* SAVE CONTACT */

function escapeVCard(value) {
    return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/\n/g, "\\n")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,");
}

function saveContact(event) {

    event.preventDefault();

    if (!currentPerson) {
        return;
    }

    const person = currentPerson;

    const vCard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `FN:${escapeVCard(person.full_name)}`,
        `ORG:${escapeVCard(person.company)}`,
        `TITLE:${escapeVCard(person.job_title)}`,
        `TEL;TYPE=CELL:${escapeVCard(person.phone)}`,
        `EMAIL;TYPE=INTERNET:${escapeVCard(person.email)}`,
        `URL:${escapeVCard(person.website)}`,
        `NOTE:${escapeVCard(person.linkedin)}`,
        "END:VCARD"
    ].join("\r\n");

    const blob = new Blob(
        [vCard],
        { type: "text/vcard;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);

    const downloadLink = document.createElement("a");

    downloadLink.href = url;
    downloadLink.download =
        `${person.full_name || "contact"}.vcf`;

    document.body.appendChild(downloadLink);

    downloadLink.click();

    document.body.removeChild(downloadLink);

    setTimeout(() => URL.revokeObjectURL(url), 1000);
}


document.getElementById("saveContact")
    .addEventListener("click", saveContact);

loadProfile();

</script>

</body>
</html>
