<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>VEUQO Digital Card</title>


    <style>

        @import url(
            'https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap'
        );


        * {
            box-sizing: border-box;
        }


        html {
            background: #050505;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                'Montserrat',
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #191919 0%,
                    #090909 40%,
                    #050505 75%
                );

            color: #ffffff;

        }


        /*
        ========================================
        PAGE
        ========================================
        */

        .page {

            width: 100%;

            max-width: 460px;

            margin: 0 auto;

            padding:
                24px
                18px
                45px;

        }


        /*
        ========================================
        LOADING / ERROR
        ========================================
        */

        #loading,
        #error {

            padding: 80px 20px;

            text-align: center;

            color: #c9a227;

            font-size: 13px;

            letter-spacing: 1px;

        }


        /*
        ========================================
        WALLET CARD
        ========================================
        */

        .wallet-card {

            position: relative;

            width: 100%;

            min-height: 335px;

            padding:
                24px
                24px
                30px;

            overflow: hidden;

            border:

                1px solid
                rgba(
                    201,
                    162,
                    39,
                    0.55
                );

            border-radius: 30px;

            background:

                radial-gradient(
                    circle at 90% 10%,
                    rgba(
                        201,
                        162,
                        39,
                        0.15
                    ),
                    transparent 32%
                ),

                linear-gradient(
                    145deg,
                    #171717 0%,
                    #0d0d0d 55%,
                    #050505 100%
                );

            box-shadow:

                0 25px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.55
                ),

                0 0 35px
                rgba(
                    201,
                    162,
                    39,
                    0.06
                );

        }


        /*
        Subtle decorative gold circle.
        */

        .wallet-card::after {

            content: "";

            position: absolute;

            width: 230px;

            height: 230px;

            right: -120px;

            bottom: -120px;

            border-radius: 50%;

            background:

                rgba(
                    201,
                    162,
                    39,
                    0.07
                );

            border:

                1px solid
                rgba(
                    201,
                    162,
                    39,
                    0.10
                );

            pointer-events: none;

        }


        /*
        ========================================
        CARD HEADER
        ========================================
        */

        .wallet-top {

            position: relative;

            z-index: 2;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

        }


        .brand {

            color: #c9a227;

            font-size: 18px;

            font-weight: 700;

            letter-spacing: 5px;

        }


        /*
        NFC-style symbol.
        */

        .nfc-symbol {

            width: 28px;

            height: 28px;

            color: #c9a227;

            opacity: 0.9;

        }


        /*
        ========================================
        PROFILE PHOTO
        ========================================
        */

        .photo-wrapper {

            position: relative;

            z-index: 2;

            width: 106px;

            height: 106px;

            margin:
                35px
                auto
                20px;

        }


        .profile-photo {

            display: none;

            width: 106px;

            height: 106px;

            object-fit: cover;

            border-radius: 50%;

            border:

                3px solid
                rgba(
                    201,
                    162,
                    39,
                    0.9
                );

            box-shadow:

                0 10px 30px
                rgba(
                    0,
                    0,
                    0,
                    0.4
                );

        }


        /*
        Placeholder shown when customer
        has no profile photo.
        */

        .photo-placeholder {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 106px;

            height: 106px;

            border-radius: 50%;

            background: #111111;

            border:

                2px solid
                rgba(
                    201,
                    162,
                    39,
                    0.45
                );

            color: #c9a227;

            font-size: 30px;

            font-weight: 600;

        }


        /*
        ========================================
        PROFILE DETAILS
        ========================================
        */

        .profile-name {

            position: relative;

            z-index: 2;

            margin: 0;

            text-align: center;

            font-size: 25px;

            font-weight: 700;

            line-height: 1.25;

        }


        .profile-job {

            position: relative;

            z-index: 2;

            margin-top: 8px;

            text-align: center;

            color: #d0d0d0;

            font-size: 14px;

            font-weight: 500;

        }


        .profile-company {

            position: relative;

            z-index: 2;

            margin-top: 6px;

            text-align: center;

            color: #c9a227;

            font-size: 13px;

            font-weight: 500;

        }


        /*
        ========================================
        CONTACT SECTION
        ========================================
        */

        .section-title {

            margin:
                28px
                5px
                12px;

            color: #777777;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 2px;

        }


        .action-list {

            display: flex;

            flex-direction: column;

            gap: 10px;

        }


        /*
        ========================================
        CONTACT BUTTON
        ========================================
        */

        .action-button {

            position: relative;

            display: none;

            align-items: center;

            width: 100%;

            min-height: 62px;

            padding:
                0
                50px
                0
                18px;

            background: #111111;

            border:

                1px solid
                rgba(
                    201,
                    162,
                    39,
                    0.28
                );

            border-radius: 18px;

            color: #ffffff;

            text-decoration: none;

            box-shadow:

                0 8px 24px
                rgba(
                    0,
                    0,
                    0,
                    0.20
                );

            transition:
                0.2s ease;

        }


        .action-button:hover {

            background: #171717;

            border-color:
                rgba(
                    201,
                    162,
                    39,
                    0.65
                );

            transform:
                translateY(-1px);

        }


        .action-button::after {

            content: "›";

            position: absolute;

            right: 20px;

            color: #c9a227;

            font-size: 28px;

            font-weight: 300;

        }


        /*
        ========================================
        BUTTON ICON
        ========================================
        */

        .action-icon {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 34px;

            min-width: 34px;

            margin-right: 14px;

            color: #c9a227;

        }


        .action-icon svg {

            display: block;

            width: 22px;

            height: 22px;

            fill: currentColor;

        }


        .linkedin-icon {
            color: #0A66C2;
        }


        .instagram-icon {
            color: #E4405F;
        }


        .facebook-icon {
            color: #1877F2;
        }


        /*
        ========================================
        BUTTON TEXT
        ========================================
        */

        .action-text {

            display: flex;

            flex-direction: column;

            text-align: left;

        }


        .action-label {

            color: #777777;

            font-size: 9px;

            font-weight: 600;

            letter-spacing: 1.4px;

            text-transform: uppercase;

        }


        .action-name {

            margin-top: 3px;

            color: #ffffff;

            font-size: 14px;

            font-weight: 600;

        }


        /*
        ========================================
        SAVE CONTACT
        ========================================
        */

        .save-contact {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            min-height: 62px;

            margin-top: 20px;

            padding:
                0
                25px;

            border-radius: 999px;

            background: #f4f4f4;

            color: #080808;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 2px;

            box-shadow:

                0 10px 30px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

            transition:
                0.2s ease;

        }


        .save-contact:hover {

            background: #ffffff;

            transform:
                translateY(-1px);

        }


        .save-contact svg {

            width: 20px;

            height: 20px;

            margin-right: 10px;

            fill: currentColor;

        }


        /*
        ========================================
        FOOTER
        ========================================
        */

        .footer {

            margin-top: 32px;

            text-align: center;

            color: #555555;

            font-size: 10px;

            letter-spacing: 1.5px;

        }


        .footer-brand {

            color: #c9a227;

            font-weight: 700;

            letter-spacing: 3px;

        }


        /*
        ========================================
        MOBILE
        ========================================
        */

        @media (
            max-width: 480px
        ) {

            .page {

                padding:
                    18px
                    14px
                    35px;

            }


            .wallet-card {

                min-height: 320px;

                padding:
                    22px
                    20px
                    28px;

                border-radius: 26px;

            }


            .profile-name {

                font-size: 23px;

            }

        }

    </style>

</head>

<script>


    /*
    ========================================
    SUPABASE
    ========================================
    */

    const SUPABASE_URL =
        "https://qldzzuqdzoarboonnizn.supabase.co/rest/v1";


    const SUPABASE_KEY =
        "sb_publishable_MOUxn_K0T9DpYe0ZZyk-TA_cMjATkVd";



    /*
    ========================================
    CARD ID
    ========================================
    */

    const pathParts =
        window.location.pathname
            .split("/")
            .filter(Boolean);


    let CARD_ID =
        null;


    let currentPerson =
        null;


    if (
        pathParts[0] === "c" &&
        pathParts[1]
    ) {

        CARD_ID =
            pathParts[1];

    }



    /*
    ========================================
    HELPER
    ========================================
    */

    function getElement(id) {

        return document.getElementById(id);

    }



    /*
    ========================================
    SHOW / HIDE PROFILE FIELD
    ========================================
    */

    function setText(
        id,
        value
    ) {

        const element =
            getElement(id);


        if (!element) {
            return;
        }


        if (
            value &&
            String(value).trim() !== ""
        ) {

            element.innerText =
                value;

            element.style.display =
                "block";

        } else {

            element.innerText =
                "";

            element.style.display =
                "none";

        }

    }



    /*
    ========================================
    SHOW / HIDE BUTTON
    ========================================
    */

    function setButton(
        id,
        value,
        href
    ) {

        const button =
            getElement(id);


        if (!button) {
            return;
        }


        if (
            value &&
            String(value).trim() !== ""
        ) {

            button.href =
                href;

            button.style.display =
                "flex";

        } else {

            button.style.display =
                "none";

        }

    }



    /*
    ========================================
    PROFILE PHOTO
    ========================================
    */

    function setProfilePhoto(
        photoUrl
    ) {

        const photo =
            getElement(
                "profilePhoto"
            );


        const placeholder =
            getElement(
                "photoPlaceholder"
            );


        if (photoUrl) {

            photo.src =
                photoUrl;


            photo.style.display =
                "block";


            placeholder.style.display =
                "none";


        } else {

            photo.src =
                "";


            photo.style.display =
                "none";


            placeholder.style.display =
                "flex";

        }

    }



    /*
    ========================================
    LOAD PROFILE
    ========================================
    */

    async function loadProfile() {


        if (!CARD_ID) {

            getElement(
                "loading"
            ).style.display =
                "none";


            getElement(
                "error"
            ).innerText =
                "No VEUQO card selected.";


            return;
        }


        try {


            const response =
                await fetch(

                    `${SUPABASE_URL}/Profiles?card_id=eq.${encodeURIComponent(CARD_ID)}&status=eq.active&select=*`,

                    {

                        headers: {

                            apikey:
                                SUPABASE_KEY

                        }

                    }

                );


            if (!response.ok) {

                throw new Error(
                    "Database request failed"
                );

            }


            const profiles =
                await response.json();


            getElement(
                "loading"
            ).style.display =
                "none";


            if (
                !profiles ||
                profiles.length === 0
            ) {

                getElement(
                    "error"
                ).innerText =
                    "Profile not found.";


                return;
            }


            const person =
                profiles[0];


            currentPerson =
                person;



            /*
            PHOTO
            */

            setProfilePhoto(
                person.profile_photo
            );



            /*
            PROFILE DETAILS
            */

            setText(
                "full_name",
                person.full_name
            );


            setText(
                "job_title",
                person.job_title
            );


            setText(
                "company",
                person.company
            );



            /*
            CONTACT BUTTONS
            */

            setButton(

                "phone",

                person.phone,

                `tel:${person.phone || ""}`

            );


            setButton(

                "email",

                person.email,

                `mailto:${person.email || ""}`

            );


            setButton(

                "website",

                person.website,

                person.website || "#"

            );


            setButton(

                "linkedin",

                person.linkedin,

                person.linkedin || "#"

            );


            setButton(

                "instagram",

                person.instagram,

                person.instagram || "#"

            );


            setButton(

                "facebook",

                person.facebook,

                person.facebook || "#"

            );



            /*
            SHOW PROFILE
            */

            getElement(
                "profile"
            ).style.display =
                "block";


        } catch (error) {


            console.error(
                "PROFILE LOAD ERROR:",
                error
            );


            getElement(
                "loading"
            ).style.display =
                "none";


            getElement(
                "error"
            ).innerText =
                "Unable to load profile.";

        }

    }



    /*
    ========================================
    VCARD ESCAPING
    ========================================
    */

    function escapeVCard(
        value
    ) {

        return String(
            value || ""
        )

            .replace(
                /\\/g,
                "\\\\"
            )

            .replace(
                /\n/g,
                "\\n"
            )

            .replace(
                /;/g,
                "\\;"
            )

            .replace(
                /,/g,
                "\\,"
            );

    }



    /*
    ========================================
    SAVE CONTACT
    ========================================
    */

    function saveContact(
        event
    ) {


        event.preventDefault();


        if (!currentPerson) {
            return;
        }


        const person =
            currentPerson;



        const vCardLines = [

            "BEGIN:VCARD",

            "VERSION:3.0",

            `FN:${escapeVCard(
                person.full_name
            )}`

        ];



        /*
        COMPANY
        */

        if (person.company) {

            vCardLines.push(

                `ORG:${escapeVCard(
                    person.company
                )}`

            );

        }



        /*
        JOB TITLE
        */

        if (person.job_title) {

            vCardLines.push(

                `TITLE:${escapeVCard(
                    person.job_title
                )}`

            );

        }



        /*
        PHONE
        */

        if (person.phone) {

            vCardLines.push(

                `TEL;TYPE=CELL:${escapeVCard(
                    person.phone
                )}`

            );

        }



        /*
        EMAIL
        */

        if (person.email) {

            vCardLines.push(

                `EMAIL;TYPE=INTERNET:${escapeVCard(
                    person.email
                )}`

            );

        }



        /*
        WEBSITE
        */

        if (person.website) {

            vCardLines.push(

                `URL:${escapeVCard(
                    person.website
                )}`

            );

        }



/*
SOCIAL LINKS
*/

if (person.linkedin) {
    vCardLines.push(
        `URL;TYPE=LinkedIn:${escapeVCard(
            person.linkedin
        )}`
    );
}

if (person.instagram) {
    vCardLines.push(
        `URL;TYPE=Instagram:${escapeVCard(
            person.instagram
        )}`
    );
}

if (person.facebook) {
    vCardLines.push(
        `URL;TYPE=Facebook:${escapeVCard(
            person.facebook
        )}`
    );
}

vCardLines.push(
    "END:VCARD"
);

return vCardLines.join("\r\n");

}

    /*
    ========================================
    SAVE CONTACT BUTTON
    ========================================
    */

    getElement(
        "saveContact"
    ).addEventListener(
        "click",
        saveContact
    );



    /*
    ========================================
    START
    ========================================
    */

    loadProfile();


</script>
