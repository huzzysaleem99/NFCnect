<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VEUQO Digital Card</title>

 <style>

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
    background: #050505;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.card {
    width: 100%;
    max-width: 420px;

    background:
        radial-gradient(
            circle at top,
            rgba(255,255,255,0.025),
            transparent 35%
        ),
        #0d0d0d;

    border: 1px solid rgba(201,162,39,0.55);
    border-radius: 28px;

    padding: 48px 30px 38px;

    text-align: center;

    box-shadow:
        0 25px 60px rgba(0,0,0,0.45),
        0 0 30px rgba(201,162,39,0.06);
}
}

.logo {
    color: #c9a227;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 8px;
    margin-bottom: 45px;
}

h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.2px;
}

.job {
    color: #c9a227;
    font-size: 16px;
    font-weight: 500;
    margin-top: 10px;
}

.company {
    color: #b5b5b5;
    font-size: 14px;
    margin-top: 6px;
    margin-bottom: 34px;
}


/* MAIN CONTACT BUTTONS */

.button {
    position: relative;
    display: flex;
    align-items: center;

    width: 100%;
    min-height: 64px;

    margin: 12px 0;
    padding: 0 48px 0 20px;

    background: #111111;
    border: 1px solid rgba(201, 162, 39, 0.55);
    border-radius: 14px;

    color: #ffffff;
    text-decoration: none;

    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    font-weight: 500;

    transition: 0.2s ease;
}

.button:hover {
    min-height: 60px;
    margin: 11px 0;
    border-radius: 15px;
  
}

/* GOLD ICON */

.icon {
    width: 30px;
    margin-right: 16px;

    color: #c9a227;

    font-size: 21px;
    font-weight: 600;

    display: inline-flex;
    justify-content: center;
    align-items: center;
}

     .linkedin-icon {
    width: 22px;
    height: 22px;
    margin-right: 16px;
    flex-shrink: 0;

    fill: #0A66C2;
}

     .social-svg {
    display: block;
    width: 23px;
    height: 23px;
    min-width: 23px;
    margin-right: 16px;
    flex-shrink: 0;
}

.instagram-svg {
    fill: #E4405F;
}

.facebook-svg {
    fill: #1877F2;
}

/* ARROW */

.button:not(.save-contact)::after {
    content: "›";

    position: absolute;
    right: 20px;

    color: #c9a227;
    font-size: 30px;
    font-weight: 300;

    line-height: 1;
}


/* SAVE CONTACT */

.button.save-contact {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    min-height: 60px;

    margin-top: 32px;
    padding: 0 28px;

    background: #f4f4f4;
    color: #090909;

    border: none;
    border-radius: 999px;

    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2.4px;
    text-transform: uppercase;

    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
}

.button.save-contact:hover {
    background: #ffffff;
    border: none;
}

.save-icon {
    font-size: 22px;
    margin-right: 12px;
    line-height: 1;
    letter-spacing: 0;
}

/* FOOTER */

.footer {
    margin-top: 38px;
    color: #777777;
    font-size: 12px;

  .qr-section {
    margin-top: 32px;
    padding-top: 26px;
    border-top: 1px solid rgba(201, 162, 39, 0.18);

    display: flex;
    flex-direction: column;
    align-items: center;
}

#qrcode {
    padding: 12px;
    background: #ffffff;

    border-radius: 18px;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.35),
        0 0 18px rgba(201, 162, 39, 0.10);

    border: 1px solid rgba(201, 162, 39, 0.45);
}

#qrcode img,
#qrcode canvas {
    display: block;
    border-radius: 7px;
}

.qr-label {
    margin-top: 14px;

    color: #c9a227;

    font-size: 10px;
    font-weight: 600;

    letter-spacing: 2px;
    text-transform: uppercase;
}
    
#error {
    color: #c9a227;
}

</style>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    
</head>

<body>

<div class="card">

    <div class="logo">VEUQO</div>

    <div id="loading">
        Loading profile...
    </div>

    <div id="profile" style="display:none;">

        <h1 id="full_name"></h1>

        <div class="job" id="job_title"></div>

        <div class="company" id="company"></div>
        

        <a class="button" id="phone">
            📞 Call
        </a>

        <a class="button" id="email">
            ✉️ Email
        </a>

        <a class="button" id="website" target="_blank">
            🌐 Website
        </a>

 <a class="button" id="linkedin" target="_blank">

    <svg class="linkedin-icon"
         viewBox="0 0 24 24"
         aria-hidden="true">
        <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V8.98h3.42v1.57h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.29zM5.32 7.41a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.1 20.45H3.54V8.98H7.1v11.47z"/>
    </svg>

    <span>LinkedIn</span>

<a class="button" id="instagram" target="_blank" style="display:none;">
    <svg class="social-svg instagram-svg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 0 1 12 7.5zm0 2A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5zM17.25 6.4a1.05 1.05 0 1 1-1.05 1.05 1.05 1.05 0 0 1 1.05-1.05z"/>
    </svg>

    <span>Instagram</span>
<a class="button" id="facebook" target="_blank" style="display:none;">
    <svg class="social-svg facebook-svg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 8h3V4h-3c-3.3 0-5 2-5 5v2H6v4h3v7h4v-7h3.5l.5-4h-4V9c0-.7.3-1 1-1z"/>
    </svg>

    <span>Facebook</span>
</a>
        
        <a class="button save-contact" id="saveContact" href="#">
    <span class="save-icon">♙+</span>
    <span>SAVE CONTACT</span>
</a>

    <div class="qr-section">
    <div id="qrcode"></div>
    <div class="qr-label">Scan to Connect</div>

    </div>

    <div id="error"></div>

    <div class="footer">
        Powered by VEUQO
    </div>

</div>

<script>

const SUPABASE_URL =
"https://qldzzuqdzoarboonnizn.supabase.co/rest/v1";

const SUPABASE_KEY =
"sb_publishable_MOUxn_K0T9DpYe0ZZyk-TA_cMjATkVd";

const pathParts = window.location.pathname.split("/").filter(Boolean);

let CARD_ID = null;
let currentPerson = null;

if (pathParts[0] === "c" && pathParts[1]) {
    CARD_ID = pathParts[1];
}


/* SHOW OR HIDE A BUTTON */

function setButton(id, value, href) {

    const button = document.getElementById(id);

    if (!button) {
        return;
    }

    if (value && String(value).trim() !== "") {
        button.href = href;
        button.style.display = "flex";
    } else {
        button.style.display = "none";
    }
}


/* LOAD PROFILE */

async function loadProfile() {

    if (!CARD_ID) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").innerText =
            "No VEUQO card selected.";
        return;
    }

    try {

        const response = await fetch(
            `${SUPABASE_URL}/Profiles?card_id=eq.${encodeURIComponent(CARD_ID)}&status=eq.active&select=*`,
            {
                headers: {
                    "apikey": SUPABASE_KEY
                }
            }
        );

        if (!response.ok) {
            throw new Error("Database request failed");
        }

        const profiles = await response.json();

        document.getElementById("loading").style.display = "none";

        if (profiles.length === 0) {
            document.getElementById("error").innerText =
                "Profile not found.";
            return;
        }

        const person = profiles[0];
        currentPerson = person;


        /* PROFILE DETAILS */

        document.getElementById("full_name").innerText =
            person.full_name || "";

        document.getElementById("job_title").innerText =
            person.job_title || "";

        document.getElementById("company").innerText =
            person.company || "";


        /* CONTACT BUTTONS */

        setButton(
            "phone",
            person.phone,
            `tel:${person.phone || ""}`
        );

        setButton(
            "email",
            person.email,
            `mailto:${person.email || ""}`
        );

        setButton(
            "website",
            person.website,
            person.website || "#"
        );

        setButton(
            "linkedin",
            person.linkedin,
            person.linkedin || "#"
        );

        setButton(
            "instagram",
            person.instagram,
            person.instagram || "#"
        );

        setButton(
            "facebook",
            person.facebook,
            person.facebook || "#"
        );


        document.getElementById("profile").style.display =
            "block";

        const profileUrl = window.location.href;

document.getElementById("qrcode").innerHTML = "";

new QRCode(document.getElementById("qrcode"), {
    text: profileUrl,
    width: 160,
    height: 160,
    correctLevel: QRCode.CorrectLevel.H
});

    } catch (error) {

        document.getElementById("loading").style.display = "none";

        document.getElementById("error").innerText =
            "Unable to load profile.";

        console.error(error);
    }
}


/* SAVE CONTACT */

function escapeVCard(value) {

    return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/\n/g, "\\n")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,");
}


function saveContact(event) {

    event.preventDefault();

    if (!currentPerson) {
        return;
    }

    const person = currentPerson;

    const vCardLines = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `FN:${escapeVCard(person.full_name)}`,
        `ORG:${escapeVCard(person.company)}`,
        `TITLE:${escapeVCard(person.job_title)}`
    ];


    if (person.phone) {
        vCardLines.push(
            `TEL;TYPE=CELL:${escapeVCard(person.phone)}`
        );
    }

    if (person.email) {
        vCardLines.push(
            `EMAIL;TYPE=INTERNET:${escapeVCard(person.email)}`
        );
    }

    if (person.website) {
        vCardLines.push(
            `URL:${escapeVCard(person.website)}`
        );
    }


    const socialLinks = [];

    if (person.linkedin) {
        socialLinks.push(`LinkedIn: ${person.linkedin}`);
    }

    if (person.instagram) {
        socialLinks.push(`Instagram: ${person.instagram}`);
    }

    if (person.facebook) {
        socialLinks.push(`Facebook: ${person.facebook}`);
    }

    if (socialLinks.length > 0) {
        vCardLines.push(
            `NOTE:${escapeVCard(socialLinks.join("\n"))}`
        );
    }


    vCardLines.push("END:VCARD");

    const vCard = vCardLines.join("\r\n");

    const blob = new Blob(
        [vCard],
        { type: "text/vcard;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);

    const downloadLink = document.createElement("a");

    downloadLink.href = url;

    downloadLink.download =
        `${person.full_name || "contact"}.vcf`;

    document.body.appendChild(downloadLink);

    downloadLink.click();

    document.body.removeChild(downloadLink);

    setTimeout(() => {
        URL.revokeObjectURL(url);
    }, 1000);
}


/* SAVE CONTACT BUTTON */

document.getElementById("saveContact")
    .addEventListener("click", saveContact);


/* START */

loadProfile();

</script>

</body>
</html>
