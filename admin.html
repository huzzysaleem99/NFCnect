<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VEUQO Production</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            background: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 25px;
        }

        .panel {
            width: 100%;
            max-width: 1100px;
            background: #0d0d0d;
            border: 1px solid rgba(201, 162, 39, 0.55);
            border-radius: 24px;
            padding: 38px 34px;
            text-align: center;
        }

        .logo {
            color: #c9a227;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 7px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777777;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 34px;
        }

        .section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(201, 162, 39, 0.18);
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            color: #c9a227;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 16px;
            background: #111111;
            color: #ffffff;
            border: 1px solid rgba(201, 162, 39, 0.45);
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #c9a227;
        }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 16px;
            border: none;
            border-radius: 999px;
            background: #f4f4f4;
            color: #080808;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .secondary-button {
            background: transparent;
            color: #c9a227;
            border: 1px solid rgba(201, 162, 39, 0.55);
        }

        .secondary-button:hover {
            background: rgba(201, 162, 39, 0.08);
            opacity: 1;
        }

        .logout-button {
            margin-top: 45px;
            background: transparent;
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
        }

        .logout-button:hover {
            background: #ff4d4d;
            color: #ffffff;
            opacity: 1;
        }

        .status {
            margin-top: 14px;
            min-height: 18px;
            font-size: 12px;
            color: #c9a227;
        }

        #customerForm {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
            margin-bottom: 30px;
            text-align: left;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        .form-field label {
            margin-bottom: 8px;
        }

        .photo-preview {
            display: none;
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            margin-top: 12px;
            border: 1px solid rgba(201, 162, 39, 0.45);
        }

        #removePhotoButton {
            display: none;
        }

        .result {
            display: none;
            margin-top: 30px;
            padding-top: 28px;
            border-top: 1px solid rgba(201, 162, 39, 0.18);
        }

        #qrcode {
            display: inline-block;
            padding: 12px;
            background: #ffffff;
            border-radius: 14px;
            margin: 18px 0;
        }

        #qrcode img,
        #qrcode canvas {
            display: block;
        }

        .profile-url {
            margin-top: 10px;
            font-size: 12px;
            color: #aaaaaa;
            word-break: break-all;
        }

        @media (max-width: 850px) {
            #customerForm {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .panel {
                padding: 30px 20px;
            }

            #customerForm {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="panel">

        <div class="logo">
            VEUQO
        </div>

        <div class="subtitle">
            CARD PRODUCTION
        </div>


        <!-- ADMIN LOGIN -->

        <div id="loginSection">

            <label for="adminEmail">
                EMAIL
            </label>

            <input
                id="adminEmail"
                type="email"
                placeholder="you@example.com"
                autocomplete="username"
            >

            <label
                for="adminPassword"
                style="margin-top:16px;"
            >
                PASSWORD
            </label>

            <input
                id="adminPassword"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button
                id="loginButton"
                type="button"
            >
                ADMIN LOGIN
            </button>

            <div
                class="status"
                id="loginStatus"
            ></div>

        </div>


        <!-- ADMIN AREA -->

        <div
            id="adminSection"
            style="display:none;"
        >


            <!-- MANAGE EXISTING CUSTOMER -->

            <div id="manageCustomerSection">

                <label for="searchCardId">
                    MANAGE CUSTOMER
                </label>

                <input
                    id="searchCardId"
                    type="text"
                    placeholder="Enter Card ID e.g. VQ-ABC123"
                >

                <button
                    id="loadCustomerButton"
                    type="button"
                    class="secondary-button"
                >
                    LOAD CUSTOMER
                </button>

                <div
                    class="status"
                    id="manageStatus"
                ></div>

            </div>


            <div class="section">


                <!-- CUSTOMER DETAILS -->

                <div id="customerForm">

                    <div class="form-field">

                        <label for="fullName">
                            FULL NAME
                        </label>

                        <input
                            id="fullName"
                            type="text"
                            placeholder="Customer name"
                        >

                    </div>


                    <div class="form-field">

                        <label for="jobTitle">
                            JOB TITLE
                        </label>

                        <input
                            id="jobTitle"
                            type="text"
                            placeholder="Job title"
                        >

                    </div>


                    <div class="form-field">

                        <label for="company">
                            COMPANY
                        </label>

                        <input
                            id="company"
                            type="text"
                            placeholder="Company"
                        >

                    </div>


                    <div class="form-field">

                        <label for="phone">
                            PHONE
                        </label>

                        <input
                            id="phone"
                            type="text"
                            placeholder="+44..."
                        >

                    </div>


                    <div class="form-field">

                        <label for="email">
                            EMAIL
                        </label>

                        <input
                            id="email"
                            type="email"
                            placeholder="customer@example.com"
                        >

                    </div>


                    <div class="form-field">

                        <label for="website">
                            WEBSITE
                        </label>

                        <input
                            id="website"
                            type="text"
                            placeholder="https://..."
                        >

                    </div>


                    <div class="form-field">

                        <label for="linkedin">
                            LINKEDIN
                        </label>

                        <input
                            id="linkedin"
                            type="text"
                            placeholder="https://linkedin.com/..."
                        >

                    </div>


                    <div class="form-field">

                        <label for="instagram">
                            INSTAGRAM
                        </label>

                        <input
                            id="instagram"
                            type="text"
                            placeholder="https://instagram.com/..."
                        >

                    </div>


                    <div class="form-field">

                        <label for="facebook">
                            FACEBOOK
                        </label>

                        <input
                            id="facebook"
                            type="text"
                            placeholder="https://facebook.com/..."
                        >

                    </div>


                    <div class="form-field">

                        <label for="profilePhoto">
                            PROFILE PHOTO
                        </label>

                        <input
                            id="profilePhoto"
                            type="file"
                            accept="image/*"
                        >

                        <img
                            id="profilePhotoPreview"
                            class="photo-preview"
                            src=""
                            alt="Profile preview"
                        >

                        <button
                            id="removePhotoButton"
                            type="button"
                            class="secondary-button"
                        >
                            REMOVE PHOTO
                        </button>

                    </div>

                </div>


                <!-- CARD ID -->

                <label for="cardId">
                    CARD ID
                </label>

                <input
                    id="cardId"
                    type="text"
                    placeholder="VQ-7H42K9"
                >


                <button
                    id="generateIdButton"
                    type="button"
                    class="secondary-button"
                >
                    GENERATE CARD ID
                </button>


                <button
                    id="createCustomerButton"
                    type="button"
                >
                    CREATE CUSTOMER
                </button>


                <button
                    id="saveChangesButton"
                    type="button"
                    class="secondary-button"
                >
                    SAVE CHANGES
                </button>


                <button
                    id="generateButton"
                    type="button"
                >
                    GENERATE QR
                </button>


                <div
                    class="status"
                    id="status"
                ></div>


                <!-- QR RESULT -->

                <div
                    class="result"
                    id="result"
                >

                    <div id="qrcode"></div>

                    <button
                        id="downloadQrButton"
                        type="button"
                    >
                        DOWNLOAD QR
                    </button>

                    <div
                        class="profile-url"
                        id="profileUrl"
                    ></div>

                </div>

            </div>


            <button
                id="logoutButton"
                type="button"
                class="logout-button"
            >
                LOG OUT
            </button>

        </div>

    </div>


    <script>

        /*
        ========================================
        SUPABASE SETTINGS
        ========================================
        */

        const SUPABASE_PROJECT_URL =
            "https://qldzzuqdzoarboonnizn.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_MOUxn_K0T9DpYe0ZZyk-TA_cMjATkVd";

        const PROFILE_PHOTO_BUCKET =
            "profile-photos";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_PROJECT_URL,
                SUPABASE_KEY
            );


        /*
        ========================================
        HELPERS
        ========================================
        */

        const $ =
            (id) => document.getElementById(id);


        let previewObjectUrl = null;


        function setStatus(
            elementId,
            message
        ) {

            $(elementId).innerText =
                message;
        }


        function fieldValue(id) {

            const value =
                $(id).value.trim();

            return value || null;
        }


        function clearPreviewObjectUrl() {

            if (previewObjectUrl) {

                URL.revokeObjectURL(
                    previewObjectUrl
                );

                previewObjectUrl = null;
            }
        }


        function showProfilePhoto(photoUrl) {

            const preview =
                $("profilePhotoPreview");

            clearPreviewObjectUrl();


            if (photoUrl) {

                preview.src =
                    photoUrl;

                preview.style.display =
                    "block";

                $("removePhotoButton").style.display =
                    "block";

            } else {

                preview.src =
                    "";

                preview.style.display =
                    "none";

                $("removePhotoButton").style.display =
                    "none";
            }
        }


        function showLocalPhotoPreview(file) {

            const preview =
                $("profilePhotoPreview");

            clearPreviewObjectUrl();


            if (!file) {
                return;
            }


            previewObjectUrl =
                URL.createObjectURL(file);

            preview.src =
                previewObjectUrl;

            preview.style.display =
                "block";
        }


        /*
        ========================================
        STORAGE PATH
        ========================================
        */

        function getStoragePathFromUrl(photoUrl) {

            if (!photoUrl) {
                return null;
            }


            try {

                const url =
                    new URL(photoUrl);

                const marker =
                    `/storage/v1/object/public/${PROFILE_PHOTO_BUCKET}/`;

                const markerPosition =
                    url.pathname.indexOf(marker);


                if (markerPosition === -1) {

                    console.error(
                        "Could not identify Storage path:",
                        photoUrl
                    );

                    return null;
                }


                return decodeURIComponent(

                    url.pathname.substring(
                        markerPosition +
                        marker.length
                    )

                );


            } catch (error) {

                console.error(
                    "Invalid photo URL:",
                    photoUrl,
                    error
                );

                return null;
            }
        }


        /*
        ========================================
        DELETE STORAGE PHOTO
        ========================================
        */

        async function deleteStoragePhoto(
            photoUrl
        ) {

            const filePath =
                getStoragePathFromUrl(
                    photoUrl
                );


            if (!filePath) {

                return {
                    success: false,
                    error: new Error(
                        "Could not identify the Storage file path."
                    )
                };
            }


            const {
                data,
                error
            } =
                await supabaseClient.storage
                    .from(
                        PROFILE_PHOTO_BUCKET
                    )
                    .remove([
                        filePath
                    ]);


            if (error) {

                console.error(
                    "PHOTO DELETE ERROR:",
                    error
                );

                return {
                    success: false,
                    error
                };
            }


            console.log(
                "Deleted Storage photo:",
                filePath,
                data
            );


            return {
                success: true,
                data
            };
        }


        /*
        ========================================
        ADMIN AUTHORISATION
        ========================================
        */

        async function isCurrentUserAdmin(
            userId
        ) {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("admin_users")
                    .select("user_id")
                    .eq(
                        "user_id",
                        userId
                    )
                    .maybeSingle();


            return (
                !error &&
                Boolean(data)
            );
        }


        /*
        ========================================
        ADMIN LOGIN
        ========================================
        */

        async function loginAdmin() {

            const email =
                $("adminEmail").value.trim();

            const password =
                $("adminPassword").value;


            setStatus(
                "loginStatus",
                "Logging in..."
            );


            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signInWithPassword({
                        email,
                        password
                    });


            if (error) {

                console.error(error);

                setStatus(
                    "loginStatus",
                    error.message
                );

                return;
            }


            const authorised =
                await isCurrentUserAdmin(
                    data.user.id
                );


            if (!authorised) {

                await supabaseClient.auth
                    .signOut();


                setStatus(
                    "loginStatus",
                    "This account is not authorised as an admin."
                );

                return;
            }


            setStatus(
                "loginStatus",
                ""
            );


            $("loginSection").style.display =
                "none";

            $("adminSection").style.display =
                "block";
        }


        /*
        ========================================
        CHECK EXISTING SESSION
        ========================================
        */

        async function checkAdminSession() {

            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .getSession();


            if (error) {

                console.error(error);

                return;
            }


            const session =
                data.session;


            if (!session) {

                $("loginSection").style.display =
                    "block";

                $("adminSection").style.display =
                    "none";

                return;
            }


            const authorised =
                await isCurrentUserAdmin(
                    session.user.id
                );


            if (!authorised) {

                await supabaseClient.auth
                    .signOut();


                setStatus(
                    "loginStatus",
                    "This account is not authorised as an admin."
                );


                $("loginSection").style.display =
                    "block";

                $("adminSection").style.display =
                    "none";


                return;
            }


            $("loginSection").style.display =
                "none";

            $("adminSection").style.display =
                "block";
        }


        /*
        ========================================
        GENERATE CARD ID
        ========================================
        */

        async function createCardId() {

            const characters =
                "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

            const maxAttempts =
                20;


            setStatus(
                "status",
                "Generating Card ID..."
            );


            for (
                let attempt = 0;
                attempt < maxAttempts;
                attempt++
            ) {

                let randomPart =
                    "";


                for (
                    let i = 0;
                    i < 6;
                    i++
                ) {

                    randomPart +=
                        characters.charAt(

                            Math.floor(
                                Math.random() *
                                characters.length
                            )

                        );
                }


                const cardId =
                    `VQ-${randomPart}`;


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("Profiles")
                        .select("card_id")
                        .eq(
                            "card_id",
                            cardId
                        )
                        .maybeSingle();


                if (error) {

                    console.error(error);

                    setStatus(
                        "status",
                        "Unable to check Card ID."
                    );

                    return;
                }


                if (!data) {

                    $("cardId").value =
                        cardId;


                    setStatus(
                        "status",
                        "Unique Card ID generated."
                    );

                    return;
                }
            }


            setStatus(
                "status",
                "Unable to generate a unique Card ID. Try again."
            );
        }


        /*
        ========================================
        GENERATE QR
        ========================================
        */

        function generateQR() {

            const cardId =
                $("cardId").value.trim();


            if (!cardId) {

                setStatus(
                    "status",
                    "Enter a Card ID."
                );

                return;
            }


            if (
                typeof QRCode ===
                "undefined"
            ) {

                setStatus(
                    "status",
                    "QR library failed to load."
                );

                return;
            }


            const profileUrl =
                `https://veuqo.co.uk/c/${encodeURIComponent(cardId)}`;


            const qrContainer =
                $("qrcode");


            qrContainer.innerHTML =
                "";


            new QRCode(
                qrContainer,
                {

                    text:
                        profileUrl,

                    width:
                        220,

                    height:
                        220,

                    colorDark:
                        "#000000",

                    colorLight:
                        "#ffffff",

                    correctLevel:
                        QRCode.CorrectLevel.H

                }
            );


            $("profileUrl").innerText =
                profileUrl;


            $("result").style.display =
                "block";


            setStatus(
                "status",
                "QR generated successfully."
            );
        }


        /*
        ========================================
        DOWNLOAD QR
        ========================================
        */

        function downloadQR() {

            const qrContainer =
                $("qrcode");


            const canvas =
                qrContainer.querySelector(
                    "canvas"
                );


            const image =
                qrContainer.querySelector(
                    "img"
                );


            let dataUrl =
                "";


            if (canvas) {

                dataUrl =
                    canvas.toDataURL(
                        "image/png"
                    );

            } else if (image) {

                dataUrl =
                    image.src;

            } else {

                setStatus(
                    "status",
                    "Generate a QR code first."
                );

                return;
            }


            const cardId =
                $("cardId").value.trim();


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                dataUrl;


            link.download =
                `${cardId || "VEUQO"}-QR.png`;


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );
        }


        /*
        ========================================
        LOAD CUSTOMER
        ========================================
        */

        async function loadCustomer() {

            const cardId =
                $("searchCardId")
                    .value
                    .trim();


            $("profilePhoto").value =
                "";


            clearPreviewObjectUrl();


            if (!cardId) {

                setStatus(
                    "manageStatus",
                    "Enter a Card ID."
                );

                return;
            }


            setStatus(
                "manageStatus",
                "Loading customer..."
            );


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("Profiles")
                    .select("*")
                    .eq(
                        "card_id",
                        cardId
                    )
                    .single();


            if (
                error ||
                !data
            ) {

                console.error(error);


                setStatus(
                    "manageStatus",
                    "Customer not found."
                );


                return;
            }


            $("fullName").value =
                data.full_name || "";

            $("jobTitle").value =
                data.job_title || "";

            $("company").value =
                data.company || "";

            $("phone").value =
                data.phone || "";

            $("email").value =
                data.email || "";

            $("website").value =
                data.website || "";

            $("linkedin").value =
                data.linkedin || "";

            $("instagram").value =
                data.instagram || "";

            $("facebook").value =
                data.facebook || "";

            $("cardId").value =
                data.card_id;


            showProfilePhoto(
                data.profile_photo || null
            );


            setStatus(
                "manageStatus",
                "Customer loaded successfully."
            );


            setStatus(
                "status",
                ""
            );
        }


        /*
        ========================================
        UPLOAD PROFILE PHOTO
        ========================================
        */

        async function uploadProfilePhoto(
            cardId
        ) {

            const file =
                $("profilePhoto").files[0];


            if (!file) {

                return null;
            }


            const fileExtension =
                file.name.includes(".")

                    ? file.name
                        .split(".")
                        .pop()
                        .toLowerCase()

                    : "jpg";


            const fileName =
                `${cardId}-${Date.now()}.${fileExtension}`;


            const filePath =
                `customers/${fileName}`;


            const {
                error: uploadError
            } =
                await supabaseClient.storage
                    .from(
                        PROFILE_PHOTO_BUCKET
                    )
                    .upload(
                        filePath,
                        file,
                        {
                            cacheControl:
                                "3600",

                            upsert:
                                false
                        }
                    );


            if (uploadError) {

                console.error(
                    "PHOTO UPLOAD ERROR:",
                    uploadError
                );


                throw uploadError;
            }


            const {
                data: publicUrlData
            } =
                supabaseClient.storage
                    .from(
                        PROFILE_PHOTO_BUCKET
                    )
                    .getPublicUrl(
                        filePath
                    );


            if (
                !publicUrlData?.publicUrl
            ) {

                throw new Error(
                    "Could not create photo URL."
                );
            }


            return (
                publicUrlData.publicUrl
            );
        }


        /*
        ========================================
        BUILD CUSTOMER DATA
        ========================================
        */

        function buildCustomerPayload() {

            return {

                full_name:
                    fieldValue("fullName"),

                job_title:
                    fieldValue("jobTitle"),

                company:
                    fieldValue("company"),

                phone:
                    fieldValue("phone"),

                email:
                    fieldValue("email"),

                website:
                    fieldValue("website"),

                linkedin:
                    fieldValue("linkedin"),

                instagram:
                    fieldValue("instagram"),

                facebook:
                    fieldValue("facebook")

            };
        }


        /*
        ========================================
        CREATE CUSTOMER
        ========================================
        */

        async function createCustomer() {

            const cardId =
                $("cardId").value.trim();


            const fullName =
                $("fullName").value.trim();


            if (!cardId) {

                setStatus(
                    "status",
                    "Generate a Card ID first."
                );

                return;
            }


            if (!fullName) {

                setStatus(
                    "status",
                    "Enter the customer's full name."
                );

                return;
            }


            let profilePhotoUrl =
                null;


            try {

                setStatus(
                    "status",
                    "Uploading photo..."
                );


                profilePhotoUrl =
                    await uploadProfilePhoto(
                        cardId
                    );


            } catch (error) {

                setStatus(
                    "status",
                    `Photo upload failed: ${error.message}`
                );


                return;
            }


            setStatus(
                "status",
                "Creating customer..."
            );


            const customer = {

                card_id:
                    cardId,

                ...buildCustomerPayload(),

                profile_photo:
                    profilePhotoUrl,

                status:
                    "active"

            };


            const {
                error
            } =
                await supabaseClient
                    .from("Profiles")
                    .insert(
                        customer
                    );


            if (error) {

                console.error(error);


                /*
                If the photo uploaded but
                customer creation failed,
                remove the orphan file.
                */

                if (profilePhotoUrl) {

                    await deleteStoragePhoto(
                        profilePhotoUrl
                    );
                }


                if (
                    error.code ===
                    "23505"
                ) {

                    setStatus(
                        "status",
                        "That Card ID already exists. Generate another."
                    );

                } else {

                    setStatus(
                        "status",
                        `Unable to create customer: ${error.message}`
                    );
                }


                return;
            }


            $("profilePhoto").value =
                "";


            showProfilePhoto(
                profilePhotoUrl
            );


            setStatus(
                "status",
                "Customer created successfully."
            );


            generateQR();
        }


        /*
        ========================================
        SAVE CHANGES
        ========================================
        */

        async function saveChanges() {

            const cardId =
                $("cardId").value.trim();


            if (!cardId) {

                setStatus(
                    "status",
                    "Load a customer first."
                );

                return;
            }


            setStatus(
                "status",
                "Saving changes..."
            );


            /*
            Get existing photo URL before
            uploading a replacement.
            */

            const {
                data: existingCustomer,
                error: fetchError
            } =
                await supabaseClient
                    .from("Profiles")
                    .select(
                        "profile_photo"
                    )
                    .eq(
                        "card_id",
                        cardId
                    )
                    .single();


            if (
                fetchError ||
                !existingCustomer
            ) {

                console.error(
                    fetchError
                );


                setStatus(
                    "status",
                    "Unable to load existing customer."
                );


                return;
            }


            const oldPhotoUrl =
                existingCustomer
                    .profile_photo ||
                null;


            let newPhotoUrl =
                null;


            /*
            Upload replacement if
            one was selected.
            */

            try {

                newPhotoUrl =
                    await uploadProfilePhoto(
                        cardId
                    );


            } catch (error) {

                setStatus(
                    "status",
                    `Photo upload failed: ${error.message}`
                );


                return;
            }


            const updates =
                buildCustomerPayload();


            /*
            Keep existing photo unless
            a new photo was selected.
            */

            if (newPhotoUrl) {

                updates.profile_photo =
                    newPhotoUrl;
            }


            const {
                error: updateError
            } =
                await supabaseClient
                    .from("Profiles")
                    .update(
                        updates
                    )
                    .eq(
                        "card_id",
                        cardId
                    );


            /*
            If DB update fails after the
            new photo uploaded, delete
            the new orphan file.
            */

            if (updateError) {

                console.error(
                    updateError
                );


                if (newPhotoUrl) {

                    await deleteStoragePhoto(
                        newPhotoUrl
                    );
                }


                setStatus(
                    "status",
                    `Unable to save changes: ${updateError.message}`
                );


                return;
            }


            let cleanupFailed =
                false;


            /*
            Database now points to the new photo.

            Delete the old photo from Storage.
            */

            if (
                newPhotoUrl &&
                oldPhotoUrl &&
                oldPhotoUrl !==
                    newPhotoUrl
            ) {

                const cleanup =
                    await deleteStoragePhoto(
                        oldPhotoUrl
                    );


                cleanupFailed =
                    !cleanup.success;
            }


            if (newPhotoUrl) {

                $("profilePhoto").value =
                    "";


                showProfilePhoto(
                    newPhotoUrl
                );
            }


            setStatus(

                "status",

                cleanupFailed

                    ? "Changes saved, but the old photo could not be deleted from Storage."

                    : "Changes saved successfully."

            );
        }


        /*
        ========================================
        REMOVE PROFILE PHOTO
        ========================================
        */

        async function removeProfilePhoto() {

            const cardId =
                $("cardId").value.trim();


            if (!cardId) {

                setStatus(
                    "status",
                    "Load a customer first."
                );

                return;
            }


            setStatus(
                "status",
                "Removing photo..."
            );


            /*
            Get the current photo URL.
            */

            const {
                data: customer,
                error: fetchError
            } =
                await supabaseClient
                    .from("Profiles")
                    .select(
                        "profile_photo"
                    )
                    .eq(
                        "card_id",
                        cardId
                    )
                    .single();


            if (
                fetchError ||
                !customer
            ) {

                console.error(
                    fetchError
                );


                setStatus(
                    "status",
                    "Unable to find customer photo."
                );


                return;
            }


            const photoUrl =
                customer
                    .profile_photo ||
                null;


            /*
            First remove the photo URL
            from the customer record.
            */

            const {
                error: updateError
            } =
                await supabaseClient
                    .from("Profiles")
                    .update({
                        profile_photo:
                            null
                    })
                    .eq(
                        "card_id",
                        cardId
                    );


            if (updateError) {

                console.error(
                    "PROFILE UPDATE ERROR:",
                    updateError
                );


                setStatus(
                    "status",
                    `Unable to remove photo: ${updateError.message}`
                );


                return;
            }


            /*
            Then delete the actual
            Storage file.
            */

            let cleanupFailed =
                false;


            if (photoUrl) {

                const cleanup =
                    await deleteStoragePhoto(
                        photoUrl
                    );


                cleanupFailed =
                    !cleanup.success;
            }


            $("profilePhoto").value =
                "";


            showProfilePhoto(
                null
            );


            setStatus(

                "status",

                cleanupFailed

                    ? "Photo removed from the profile, but the Storage file could not be deleted."

                    : "Photo removed successfully."

            );
        }


        /*
        ========================================
        LOG OUT
        ========================================
        */

        async function logoutAdmin() {

            await supabaseClient.auth
                .signOut();


            $("adminSection").style.display =
                "none";


            $("loginSection").style.display =
                "block";


            $("adminPassword").value =
                "";


            setStatus(
                "loginStatus",
                "Logged out successfully."
            );
        }


        /*
        ========================================
        PHOTO PREVIEW
        ========================================
        */

        $("profilePhoto")
            .addEventListener(
                "change",
                function () {

                    const file =
                        this.files[0];


                    if (!file) {
                        return;
                    }


                    showLocalPhotoPreview(
                        file
                    );
                }
            );


        /*
        ========================================
        BUTTON EVENTS
        ========================================
        */

        $("loginButton")
            .addEventListener(
                "click",
                loginAdmin
            );


        $("loadCustomerButton")
            .addEventListener(
                "click",
                loadCustomer
            );


        $("generateIdButton")
            .addEventListener(
                "click",
                createCardId
            );


        $("createCustomerButton")
            .addEventListener(
                "click",
                createCustomer
            );


        $("saveChangesButton")
            .addEventListener(
                "click",
                saveChanges
            );


        $("removePhotoButton")
            .addEventListener(
                "click",
                removeProfilePhoto
            );


        $("generateButton")
            .addEventListener(
                "click",
                generateQR
            );


        $("downloadQrButton")
            .addEventListener(
                "click",
                downloadQR
            );


        $("logoutButton")
            .addEventListener(
                "click",
                logoutAdmin
            );


        /*
        Allow Enter to log in.
        */

        $("adminPassword")
            .addEventListener(
                "keydown",
                (event) => {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        loginAdmin();
                    }
                }
            );


        /*
        Check whether an admin
        is already logged in.
        */

        checkAdminSession();

    </script>

</body>
