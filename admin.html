<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VEUQO Production</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
    background: #050505;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.panel {
    width: 100%;
    max-width: 460px;
    background: #0d0d0d;
    border: 1px solid rgba(201,162,39,0.55);
    border-radius: 24px;
    padding: 38px 28px;
    text-align: center;
}

.logo {
    color: #c9a227;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 7px;
    margin-bottom: 8px;
}

.subtitle {
    color: #777777;
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 34px;
}

label {
    display: block;
    text-align: left;
    margin-bottom: 8px;
    color: #c9a227;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
}

input {
    width: 100%;
    padding: 16px;
    background: #111111;
    color: #ffffff;
    border: 1px solid rgba(201,162,39,0.45);
    border-radius: 12px;
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    outline: none;
}

button {
    width: 100%;
    margin-top: 16px;
    padding: 16px;
    border: none;
    border-radius: 999px;
    background: #f4f4f4;
    color: #080808;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    letter-spacing: 1.5px;
    cursor: pointer;
}

.result {
    display: none;
    margin-top: 30px;
    padding-top: 28px;
    border-top: 1px solid rgba(201,162,39,0.18);
}

#qrcode {
    display: inline-block;
    padding: 12px;
    background: #ffffff;
    border-radius: 14px;
    margin: 18px 0;
}

#qrcode img,
#qrcode canvas {
    display: block;
}

.profile-url {
    margin-top: 10px;
    font-size: 12px;
    color: #aaaaaa;
    word-break: break-all;
}

.status {
    margin-top: 14px;
    font-size: 12px;
    color: #c9a227;
}

    .secondary-button {
    background: transparent;
    color: #c9a227;
    border: 1px solid rgba(201,162,39,0.55);
}

.secondary-button:hover {
    background: rgba(201,162,39,0.08);
}

</style>

</head>

<body>

<div class="panel">

    <div class="logo">VEUQO</div>

    <div class="subtitle">
        CARD PRODUCTION
    </div>

    <div id="loginSection">

    <label for="adminEmail">
        EMAIL
    </label>

    <input
        id="adminEmail"
        type="email"
        placeholder="you@example.com"
    >

    <label
        for="adminPassword"
        style="margin-top:16px;"
    >
        PASSWORD
    </label>

    <input
        id="adminPassword"
        type="password"
        placeholder="Password"
    >

    <button id="loginButton">
        ADMIN LOGIN
    </button>

    <div class="status" id="loginStatus"></div>

</div>

    <div id="adminSection" style="display:none;">

    <label for="cardId">
        CARD ID
    </label>

    <input
        id="cardId"
        type="text"
        placeholder="VQ-7H42K9"
    >

    <button id="generateIdButton" class="secondary-button">
    GENERATE CARD ID
</button>
    

    <button id="generateButton">
        GENERATE QR
    </button>

    <div class="result" id="result">
    <div id="qrcode"></div>

    <button id="downloadQrButton">
        DOWNLOAD QR
    </button>

    <div class="profile-url" id="profileUrl"></div>
</div>


    </div>

</div>


<script>

    const supabaseClient = supabase.createClient(
    "https://qldzzuqdzoarboonnizn.supabase.co",
    "sb_publishable_MOUxn_K0T9DpYe0ZZyk-TA_cMjATkVd"
);

async function loginAdmin() {

    const email =
        document.getElementById("adminEmail").value.trim();

    const password =
        document.getElementById("adminPassword").value;

    const loginStatus =
        document.getElementById("loginStatus");

    loginStatus.innerText = "Logging in...";

    // Sign in with Supabase
    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    // Login failed
    if (error) {
        loginStatus.innerText = error.message;
        console.error(error);
        return;
    }

    // Check whether this user is a VEUQO admin
    const userId = data.user.id;

    const { data: adminRecord, error: adminError } =
        await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", userId)
            .single();

    // Logged in, but not an authorised admin
    if (adminError || !adminRecord) {

        await supabaseClient.auth.signOut();

        loginStatus.innerText =
            "This account is not authorised as an admin.";

        return;
    }

    // Authorised admin
    loginStatus.innerText = "";

    document.getElementById("loginSection").style.display =
        "none";

    document.getElementById("adminSection").style.display =
        "block";
}

document
    .getElementById("loginButton")
    .addEventListener("click", loginAdmin);

    async function checkAdminSession() {

    const { data } =
        await supabaseClient.auth.getSession();

    if (data.session) {

        document.getElementById("loginSection").style.display =
            "none";

        document.getElementById("adminSection").style.display =
            "block";
    }
}

async function checkAdminSession() {

    const { data } =
        await supabaseClient.auth.getSession();

    const session = data.session;

    if (!session) {
        return;
    }

    const userId = session.user.id;

    const { data: adminRecord, error } =
        await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", userId)
            .single();

    if (error || !adminRecord) {

        await supabaseClient.auth.signOut();

        document.getElementById("loginStatus").innerText =
            "This account is not authorised as an admin.";

        document.getElementById("loginSection").style.display =
            "block";

        document.getElementById("adminSection").style.display =
            "none";

        return;
    }

    document.getElementById("loginSection").style.display =
        "none";

    document.getElementById("adminSection").style.display =
        "block";
}

            {

                }
            }
        );

        if (!response.ok) {

        }

        const existing = await response.json();

        if (existing.length === 0) {

        }
    }

    document.getElementById("cardId").value = cardId;

    document.getElementById("status").innerText =

}


document
    .getElementById("generateIdButton")
    .addEventListener("click", createCardId);

function generateQR() {

    const status =
        document.getElementById("status");

    const cardId =
        document
            .getElementById("cardId")
            .value
            .trim();
            

    if (!cardId) {
        status.innerText = "Enter a Card ID.";
        return;
    }

    if (typeof QRCode === "undefined") {
        status.innerText =
            "QR library failed to load.";
        return;
    }

    const profileUrl =
        `https://veuqo.co.uk/c/${encodeURIComponent(cardId)}`;

    const qrContainer =
        document.getElementById("qrcode");

    qrContainer.innerHTML = "";

    new QRCode(qrContainer, {
        text: profileUrl,
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
    });

    document.getElementById("profileUrl").innerText =
        profileUrl;

    document.getElementById("result").style.display =
        "block";

    status.innerText = "QR generated successfully.";
}


document
    .getElementById("generateButton")
    .addEventListener("click", generateQR);

    function downloadQR() {

    const qrContainer =
        document.getElementById("qrcode");

    const canvas =
        qrContainer.querySelector("canvas");

    const image =
        qrContainer.querySelector("img");

    let dataUrl = "";

    if (canvas) {
        dataUrl = canvas.toDataURL("image/png");
    } else if (image) {
        dataUrl = image.src;
    } else {
        alert("Generate a QR code first.");
        return;
    }

    const cardId =
        document
            .getElementById("cardId")
            .value
            .trim();

    const link = document.createElement("a");

    link.href = dataUrl;
    link.download = `${cardId || "VEUQO"}-QR.png`;

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

document
    .getElementById("downloadQrButton")
    .addEventListener("click", downloadQR);

</script>

</body>

</html>
