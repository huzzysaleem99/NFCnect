<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VEUQO Production</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
    background: #050505;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.panel {
    width: 100%;
    max-width: 460px;
    background: #0d0d0d;
    border: 1px solid rgba(201,162,39,0.55);
    border-radius: 24px;
    padding: 38px 28px;
    text-align: center;
}

.logo {
    color: #c9a227;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 7px;
    margin-bottom: 8px;
}

.subtitle {
    color: #777777;
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 34px;
}

label {
    display: block;
    text-align: left;
    margin-bottom: 8px;
    color: #c9a227;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
}

input {
    width: 100%;
    padding: 16px;
    background: #111111;
    color: #ffffff;
    border: 1px solid rgba(201,162,39,0.45);
    border-radius: 12px;
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    outline: none;
}

button {
    width: 100%;
    margin-top: 16px;
    padding: 16px;
    border: none;
    border-radius: 999px;
    background: #f4f4f4;
    color: #080808;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    letter-spacing: 1.5px;
    cursor: pointer;
}

.result {
    display: none;
    margin-top: 30px;
    padding-top: 28px;
    border-top: 1px solid rgba(201,162,39,0.18);
}

#qrcode {
    display: inline-block;
    padding: 12px;
    background: #ffffff;
    border-radius: 14px;
    margin: 18px 0;
}

#qrcode img,
#qrcode canvas {
    display: block;
}

.profile-url {
    margin-top: 10px;
    font-size: 12px;
    color: #aaaaaa;
    word-break: break-all;
}

.status {
    margin-top: 14px;
    font-size: 12px;
    color: #c9a227;
}

    .secondary-button {
    background: transparent;
    color: #c9a227;
    border: 1px solid rgba(201,162,39,0.55);
}

.secondary-button:hover {
    background: rgba(201,162,39,0.08);
}

    .logout-button {
    margin-top: 40px;
    background: transparent;
    color: #ff4d4d;
    border: 1px solid #ff4d4d;
}

.logout-button:hover {
    background: #ff4d4d;
    color: #ffffff;

    #manageCustomerSection {
    margin-bottom: 35px;
    padding-bottom: 30px;
    border-bottom: 1px solid rgba(201,162,39,0.18);
}
}
</style>

</head>

<body>

<div class="panel">

    <div class="logo">VEUQO</div>

    <div class="subtitle">
        CARD PRODUCTION
    </div>

    <div id="loginSection">

    <label for="adminEmail">
        EMAIL
    </label>

    <input
        id="adminEmail"
        type="email"
        placeholder="you@example.com"
    >

    <label
        for="adminPassword"
        style="margin-top:16px;"
    >
        PASSWORD
    </label>

    <input
        id="adminPassword"
        type="password"
        placeholder="Password"
    >

    <button id="loginButton">
        ADMIN LOGIN
    </button>

    <div class="status" id="loginStatus"></div>

</div>

    <div id="manageCustomerSection">

    <label for="searchCardId">
        MANAGE CUSTOMER
    </label>

    <input
        id="searchCardId"
        type="text"
        placeholder="Enter Card ID e.g. VQ-ABC123"
    >

    <button
        id="loadCustomerButton"
        class="secondary-button"
    >
        LOAD CUSTOMER
    </button>

    <div
        class="status"
        id="manageStatus"
    ></div>

 <div id="adminSection" style="display:none;">

    <div id="customerForm">

        <label for="fullName">FULL NAME</label>
        <input
            id="fullName"
            type="text"
            placeholder="Customer name"
        >

        <label for="jobTitle" style="margin-top:16px;">
            JOB TITLE
        </label>
        <input
            id="jobTitle"
            type="text"
            placeholder="Job title"
        >

        <label for="company" style="margin-top:16px;">
            COMPANY
        </label>
        <input
            id="company"
            type="text"
            placeholder="Company"
        >

        <label for="phone" style="margin-top:16px;">
            PHONE
        </label>
        <input
            id="phone"
            type="text"
            placeholder="+44..."
        >

        <label for="email" style="margin-top:16px;">
            EMAIL
        </label>
        <input
            id="email"
            type="email"
            placeholder="customer@example.com"
        >

        <label for="website" style="margin-top:16px;">
            WEBSITE
        </label>
        <input
            id="website"
            type="text"
            placeholder="https://..."
        >

        <label for="linkedin" style="margin-top:16px;">
            LINKEDIN
        </label>
        <input
            id="linkedin"
            type="text"
            placeholder="https://linkedin.com/..."
        >

        <label for="instagram" style="margin-top:16px;">
            INSTAGRAM
        </label>
        <input
            id="instagram"
            type="text"
            placeholder="https://instagram.com/..."
        >

        <label for="facebook" style="margin-top:16px;">
            FACEBOOK
        </label>
        <input
            id="facebook"
            type="text"
            placeholder="https://facebook.com/..."
        >

    </div>


    <label for="cardId" style="margin-top:22px;">
        CARD ID
    </label>

    <input
        id="cardId"
        type="text"
        placeholder="VQ-7H42K9"
    >

    <button
        id="generateIdButton"
        class="secondary-button"
    >
        GENERATE CARD ID
    </button>

    <button id="createCustomerButton">
        CREATE CUSTOMER
    </button>

     <button id="saveChangesButton" class="secondary-button">
    SAVE CHANGES
</button>

    <button id="generateButton">
        GENERATE QR
    </button>


    <div class="status" id="status"></div>


    <div class="result" id="result">

        <div id="qrcode"></div>

        <button id="downloadQrButton">
            DOWNLOAD QR
        </button>

        <div
            class="profile-url"
            id="profileUrl"
        ></div>

    </div>


    <button
        id="logoutButton"
        class="logout-button"
    >
        LOG OUT
    </button>

</div>
</div>


<script>

const supabaseClient = supabase.createClient(
    "https://qldzzuqdzoarboonnizn.supabase.co",
    "sb_publishable_MOUxn_K0T9DpYe0ZZyk-TA_cMjATkVd"
);

const SUPABASE_URL =
    "https://qldzzuqdzoarboonnizn.supabase.co/rest/v1";

const SUPABASE_KEY =
    "sb_publishable_MOUxn_K0T9DpYe0ZZyk-TA_cMjATkVd";


async function loginAdmin() {

    const email =
        document.getElementById("adminEmail").value.trim();

    const password =
        document.getElementById("adminPassword").value;

    const loginStatus =
        document.getElementById("loginStatus");

    loginStatus.innerText = "Logging in...";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {
        loginStatus.innerText = error.message;
        console.error(error);
        return;
    }

    const userId = data.user.id;

    const { data: adminRecord, error: adminError } =
        await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", userId)
            .single();

    if (adminError || !adminRecord) {

        await supabaseClient.auth.signOut();

        loginStatus.innerText =
            "This account is not authorised as an admin.";

        return;
    }

    loginStatus.innerText = "";

    document.getElementById("loginSection").style.display =
        "none";

    document.getElementById("adminSection").style.display =
        "block";
}


document
    .getElementById("loginButton")
    .addEventListener("click", loginAdmin);


async function checkAdminSession() {

    const { data } =
        await supabaseClient.auth.getSession();

    const session = data.session;

    if (!session) {
        return;
    }

    const userId = session.user.id;

    const { data: adminRecord, error } =
        await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", userId)
            .single();

    if (error || !adminRecord) {

        await supabaseClient.auth.signOut();

        document.getElementById("loginStatus").innerText =
            "This account is not authorised as an admin.";

        document.getElementById("loginSection").style.display =
            "block";

        document.getElementById("adminSection").style.display =
            "none";

        return;
    }

    document.getElementById("loginSection").style.display =
        "none";

    document.getElementById("adminSection").style.display =
        "block";
}


async function createCardId() {

    const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let unique = false;
    let cardId = "";

    while (!unique) {

        let randomPart = "";

        for (let i = 0; i < 6; i++) {

            randomPart += characters.charAt(
                Math.floor(Math.random() * characters.length)
            );
        }

        cardId = `VQ-${randomPart}`;

        const response = await fetch(
            `${SUPABASE_URL}/Profiles?card_id=eq.${encodeURIComponent(cardId)}&select=card_id`,
            {
                headers: {
                    "apikey": SUPABASE_KEY
                }
            }
        );

        if (!response.ok) {

            document.getElementById("status").innerText =
                "Unable to check Card ID.";

            return;
        }

        const existing = await response.json();

        if (existing.length === 0) {
            unique = true;
        }
    }

    document.getElementById("cardId").value =
        cardId;

    document.getElementById("status").innerText =
        "Unique Card ID generated.";
}


document
    .getElementById("generateIdButton")
    .addEventListener("click", createCardId);


function generateQR() {

    const status =
        document.getElementById("status");

    const cardId =
        document
            .getElementById("cardId")
            .value
            .trim();

    if (!cardId) {

        status.innerText =
            "Enter a Card ID.";

        return;
    }

    if (typeof QRCode === "undefined") {

        status.innerText =
            "QR library failed to load.";

        return;
    }

    const profileUrl =
        `https://veuqo.co.uk/c/${encodeURIComponent(cardId)}`;

    const qrContainer =
        document.getElementById("qrcode");

    qrContainer.innerHTML = "";

    new QRCode(qrContainer, {
        text: profileUrl,
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
    });

    document.getElementById("profileUrl").innerText =
        profileUrl;

    document.getElementById("result").style.display =
        "block";

    status.innerText =
        "QR generated successfully.";
}


document
    .getElementById("generateButton")
    .addEventListener("click", generateQR);


function downloadQR() {

    const qrContainer =
        document.getElementById("qrcode");

    const canvas =
        qrContainer.querySelector("canvas");

    const image =
        qrContainer.querySelector("img");

    let dataUrl = "";

    if (canvas) {

        dataUrl =
            canvas.toDataURL("image/png");

    } else if (image) {

        dataUrl = image.src;

    } else {

        alert("Generate a QR code first.");
        return;
    }

    const cardId =
        document
            .getElementById("cardId")
            .value
            .trim();

    const link =
        document.createElement("a");

    link.href = dataUrl;

    link.download =
        `${cardId || "VEUQO"}-QR.png`;

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}


document
    .getElementById("downloadQrButton")
    .addEventListener("click", downloadQR);

    async function loadCustomer() {

    const manageStatus =
        document.getElementById("manageStatus");

    const cardId =
        document
            .getElementById("searchCardId")
            .value
            .trim();

    if (!cardId) {
        manageStatus.innerText =
            "Enter a Card ID.";
        return;
    }

    manageStatus.innerText =
        "Loading customer...";

    const { data, error } =
        await supabaseClient
            .from("Profiles")
            .select("*")
            .eq("card_id", cardId)
            .single();

    if (error || !data) {
        console.error(error);

        manageStatus.innerText =
            "Customer not found.";

        return;
    }

    document.getElementById("fullName").value =
        data.full_name || "";

    document.getElementById("jobTitle").value =
        data.job_title || "";

    document.getElementById("company").value =
        data.company || "";

    document.getElementById("phone").value =
        data.phone || "";

    document.getElementById("email").value =
        data.email || "";

    document.getElementById("website").value =
        data.website || "";

    document.getElementById("linkedin").value =
        data.linkedin || "";

    document.getElementById("instagram").value =
        data.instagram || "";

    document.getElementById("facebook").value =
        data.facebook || "";

    document.getElementById("cardId").value =
        data.card_id;

    manageStatus.innerText =
        "Customer loaded successfully.";
}


document
    .getElementById("loadCustomerButton")
    .addEventListener("click", loadCustomer);

    async function createCustomer() {

    const status =
        document.getElementById("status");

    const cardId =
        document.getElementById("cardId").value.trim();

    const fullName =
        document.getElementById("fullName").value.trim();

    if (!cardId) {
        status.innerText =
            "Generate a Card ID first.";
        return;
    }

    if (!fullName) {
        status.innerText =
            "Enter the customer's full name.";
        return;
    }

    status.innerText =
        "Creating customer...";

    const customer = {
        card_id: cardId,
        full_name: fullName,
        job_title:
            document.getElementById("jobTitle").value.trim() || null,

        company:
            document.getElementById("company").value.trim() || null,

        phone:
            document.getElementById("phone").value.trim() || null,

        email:
            document.getElementById("email").value.trim() || null,

        website:
            document.getElementById("website").value.trim() || null,

        linkedin:
            document.getElementById("linkedin").value.trim() || null,

        instagram:
            document.getElementById("instagram").value.trim() || null,

        facebook:
            document.getElementById("facebook").value.trim() || null,

        status: "active"
    };

    const { error } =
        await supabaseClient
            .from("Profiles")
            .insert(customer);

    if (error) {

        console.error(error);

        if (error.code === "23505") {
            status.innerText =
                "That Card ID already exists. Generate another.";
        } else {
            status.innerText =
                "Unable to create customer: " + error.message;
        }

        return;
    }

    status.innerText =
        "Customer created successfully.";

    generateQR();
}


document
    .getElementById("createCustomerButton")
    .addEventListener("click", createCustomer);

    async function saveCustomerChanges() {

    const status =
        document.getElementById("status");

    const cardId =
        document.getElementById("cardId").value.trim();

    if (!cardId) {
        status.innerText =
            "Load a customer first.";
        return;
    }

    status.innerText =
        "Saving changes...";

    const updates = {
        full_name:
            document.getElementById("fullName").value.trim(),

        job_title:
            document.getElementById("jobTitle").value.trim() || null,

        company:
            document.getElementById("company").value.trim() || null,

        phone:
            document.getElementById("phone").value.trim() || null,

        email:
            document.getElementById("email").value.trim() || null,

        website:
            document.getElementById("website").value.trim() || null,

        linkedin:
            document.getElementById("linkedin").value.trim() || null,

        instagram:
            document.getElementById("instagram").value.trim() || null,

        facebook:
            document.getElementById("facebook").value.trim() || null
    };

    const { error } =
        await supabaseClient
            .from("Profiles")
            .update(updates)
            .eq("card_id", cardId);

    if (error) {
        console.error(error);

        status.innerText =
            "Unable to save changes: " + error.message;

        return;
    }

    status.innerText =
        "Changes saved successfully.";
}

document
    .getElementById("saveChangesButton")
    .addEventListener("click", saveCustomerChanges);

async function logoutAdmin() {

    await supabaseClient.auth.signOut();

    document.getElementById("adminSection").style.display =
        "none";

    document.getElementById("loginSection").style.display =
        "block";

    document.getElementById("adminPassword").value =
        "";

    document.getElementById("loginStatus").innerText =
        "Logged out successfully.";
}

document
    .getElementById("logoutButton")
    .addEventListener("click", logoutAdmin);
    
checkAdminSession();

</script>

</body>

</html>
